name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Run every example against the built package
        run: node scripts/run-examples.mjs
      - name: Run every README code block
        run: node scripts/run-readme.mjs

  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - name: Deno smoke test
        run: deno run --allow-read scripts/runtime-smoke.mjs
      - name: Bun smoke test
        run: bun scripts/runtime-smoke.mjs
      - name: CommonJS smoke test
        run: node scripts/runtime-smoke.cjs
